prompt: >
  I have temperature-dependent FDTR data for the Au/graphite sample stored in the folder /app/data/L2_HOPGA.
  Please use the Gold_film material for Au properties and Graphite_new material for graphite properties.
  The thickness of Au is 73 nm.


  Please perform the following iterative fitting workflow for room-temperature data first:


  1. Use the averaged offset-amplitude data at the highest modulation frequency to fit the spot sizes
  in the x and y directions. In this step, keep the thermal properties fixed to their current values.
  For the first iteration, use the nominal thermal properties. For later iterations, use the updated
  thermal properties from the previous iteration. Calculate the effective spot size as the average of
  the fitted x- and y-direction spot sizes.


  2. Use the fitted x-direction spot size and the averaged x-direction offset-phase data to fit the
  graphite in-plane thermal conductivity. Choose the data measured at frequency 1 MHz.


  3. Use the fitted effective spot size and the averaged phase-frequency data to fit the graphite
  out-of-plane thermal conductivity and the Au/graphite interfacial thermal conductance.


  4. After each iteration, update the fitted spot sizes, graphite in-plane thermal conductivity, graphite
  out-of-plane thermal conductivity, and Au/graphite interfacial thermal conductance. Repeat steps 1-3 until
  both the fitted graphite in-plane and out-of-plane thermal conductivities change by less than 1% between
  two consecutive iterations, or until 6 iterations have been completed.


  Then for data measured at other temperature, use the following workflow:


  5. Fix the x-direction spot size to the final room-temperature x-direction spot size, and use the averaged
  x-direction offset-phase data to fit the graphite in-plane thermal conductivity. Choose the data measured
  at frequency 1 MHz.


  6. Fix the effective spot size to the final room-temperature effective spot size, and use the averaged
  phase-frequency data to fit the graphite out-of-plane thermal conductivity and the Au/graphite interfacial
  thermal conductance.


  7. Update the fitted thermal parameters after each iteration. Repeat steps 1-2 until both the graphite
  in-plane and out-of-plane thermal conductivities change by less than 2% between two consecutive iterations,
  or until 6 iterations have been completed.


  Please report the room-temperature fitted spot sizes, the fitted thermal parameters at each temperature,
  and the final converged values. Summarize the temperature-dependent graphite in-plane thermal conductivity,
  graphite out-of-plane thermal conductivity, and Au/graphite interfacial thermal conductances in a table.
  Plot the graphite in-plane and out-of-plane thermal conductivities as functions of temperature in separate figures.
  Proceed directly to run the fit without asking for confirmation.
