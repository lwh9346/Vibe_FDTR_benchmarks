      HOPGA_at_120C_TBC_1: W m-2 K-1
prompt: >
  I have temperature-dependent FDTR data for the Au/graphite sample stored in the folder /app/data/L2_HOPGA.
  Please use the Gold_film material for Au properties and Graphite_new material for graphite properties.
  The effective spot size is 2.75 um. The thickness of Au is 73 nm.


  For each temperature, use the phase-frequency data to fit the graphite in-plane thermal conductivity
  and the Au/graphite interfacial conductance.
  Please summarize the fitted values at all temperatures in a table
  and plot the temperature-dependent graphite in-plane thermal conductivity and interface conductance.
  Proceed directly to run the fit without asking for confirmation.
