      HOPGA_at_0C_Sr_2: 1978.8122
      HOPGA_at_0C_TBC_1: 89746000.0
      HOPGA_at_22C_Sr_2: 1820.7498
      HOPGA_at_22C_TBC_1: 95953000.0
      HOPGA_at_60C_Sr_2: 1575.3799
      HOPGA_at_60C_TBC_1: 103140000.0
      HOPGA_at_90C_Sr_2: 1413.5964
      HOPGA_at_90C_TBC_1: 115450000.0
      HOPGA_at_120C_Sr_2: 1264.9319
      HOPGA_at_120C_TBC_1: 119140000.0
    units:
      HOPGA_at_m105C_Sr_2: W m-1 K-1
      HOPGA_at_m105C_TBC_1: W m-2 K-1
      HOPGA_at_m90C_Sr_2: W m-1 K-1
      HOPGA_at_m90C_TBC_1: W m-2 K-1
      HOPGA_at_m60C_Sr_2: W m-1 K-1
      HOPGA_at_m60C_TBC_1: W m-2 K-1
      HOPGA_at_m30C_Sr_2: W m-1 K-1
      HOPGA_at_m30C_TBC_1: W m-2 K-1
      HOPGA_at_0C_Sr_2: W m-1 K-1
      HOPGA_at_0C_TBC_1: W m-2 K-1
      HOPGA_at_22C_Sr_2: W m-1 K-1
      HOPGA_at_22C_TBC_1: W m-2 K-1
      HOPGA_at_60C_Sr_2: W m-1 K-1
