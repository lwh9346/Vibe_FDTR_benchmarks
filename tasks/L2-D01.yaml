id: L2-D01
description: Averaged phase-frequency fitting (room-temp, exclude point11)
data_dirs:
  - L2D01_HOPGA
timeout: 900
outputs:
  - file: result.yaml
    compare: keyvalue
    tolerance: 0.005
    groundtruth:
      Sz_2: 5.8803
      TBC_1: 94660000.0
    units:
      Sz_2: W m-1 K-1
      TBC_1: W m-2 K-1
prompt: >
  I have FDTR data for an Au/graphite sample stored in the folder /app/data/L2D01_HOPGA.
  The sample consists of an Au transducer on a graphite substrate.
  Please use the Gold_film material for Au properties and Graphite_new material for graphite properties.
  The effective spot size is 2.75 um. The thickness of Au is 73 nm.
  Set the in-plane conductivity of graphite to be 1800 W m-1 K-1.


  Use the room-temperature phase-frequency data. Exclude point11, average the remaining repeated data,
  and fit the graphite out-of-plane thermal conductivity and the Au/graphite interfacial conductance.
  Please report the fitted values and output the fitting plot.
  Proceed directly to run the fit without asking for confirmation.
