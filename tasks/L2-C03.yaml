id: L2-C03
description: Sensitivity -> fit -> uncertainty (room-temp, full pipeline)
data_dirs:
  - L2_HOPGA
timeout: 900
outputs:
  - file: result.yaml
    compare: keyvalue
    tolerance: 0.005
    groundtruth:
      Sz_2: 6.2476
      TBC_1: 91700000.0
      Sz_2_pct: 21.95
      TBC_1_pct: 11.02
    units:
      Sz_2: W m-1 K-1
      TBC_1: W m-2 K-1
      Sz_2_pct: "%"
      TBC_1_pct: "%"
prompt: >
  I have room-temperature FDTR data for the Au/graphite sample stored in the folder /app/data/L2_HOPGA.
  Please use the Gold_film material for Au properties and Graphite_new material for graphite properties.
  The effective spot size is 2.75 um. The thickness of Au is 73 nm.


  Using the nominal parameter values, first calculate the phase sensitivity over the whole frequency range.
  Then use the averaged data to fit the graphite out-of-plane thermal conductivity
  and the Au/graphite interfacial conductance.
  After fitting, calculate the uncertainties of the fitted parameters.
  Assume a 5% uncertainty for all fixed parameters.
  Please report the fitted values, the corresponding uncertainties,
  and output both the sensitivity plot and the fitting plot.
  Proceed directly to run the fit without asking for confirmation.
