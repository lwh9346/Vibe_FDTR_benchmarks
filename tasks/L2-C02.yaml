id: L2-C02
description: Offset fit + uncertainty (room-temp, X-scan, offset-range subset)
data_dirs:
  - L2_HOPGA
timeout: 900
outputs:
  - file: result.yaml
    compare: keyvalue
    tolerance: 0.005
    groundtruth:
      Sr_2: 1818.5573
      TBC_1: 107220000.0
      Sr_2_pct: 5.43
      TBC_1_pct: 69.60
    units:
      Sr_2: W m-1 K-1
      TBC_1: W m-2 K-1
      Sr_2_pct: "%"
      TBC_1_pct: "%"
prompt: >
  I have room-temperature FDTR data for the Au/graphite sample stored in the folder /app/data/L2_HOPGA.
  Please use the Gold_film material for Au properties and Graphite_new material for graphite properties.
  The effective spot size is 2.75 um. The thickness of Au is 73 nm.


  Use the averaged phase-offset data for X-direction scan to fit the graphite in-plane thermal conductivity
  and the Au/graphite interfacial conductance.
  Choose the data measured at frequency 1 MHz and offset range between -13 to -6 and 6 to 13 um for fitting.
  Then calculate the uncertainties of the fitted parameters.
  Assume a 10% uncertainty for the out-of-plane conductivity and 5% uncertainty for all other fixed parameters.
  Please report the fitted values and the corresponding uncertainties.
  Proceed directly to run the fit without asking for confirmation.
