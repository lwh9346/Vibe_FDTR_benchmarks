[project]
name = "fdtr-bench"
version = "0.1.0"
description = "FDTR AI Agent Benchmark Runner & Evaluator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pyyaml>=6.0",
]

[project.scripts]
fdtr-bench = "fdtr_bench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdtr_bench"]
